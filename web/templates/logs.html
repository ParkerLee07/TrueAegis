{% extends "layout.html" %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Action Output</p>
        <h2>Logs</h2>
        <p>Output from web-triggered TrueAegis actions.</p>
    </div>
</section>

<section class="panel">
    {% if logs %}
    <div class="table-wrap">
        <table>
            <tr><th>Log</th><th>Open</th></tr>
            {% for log in logs %}
            <tr>
                <td>{{ log.name }}</td>
                <td><a class="button-link" href="/logs/{{ log.name }}">Open</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
    {% else %}
    <p class="muted">No logs found.</p>
    {% endif %}
</section>
{% endblock %}
